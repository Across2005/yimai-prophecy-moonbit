# OpenAI Codex CLI — yimai MCP server (Streamable HTTP)
# Copy to: ~/.codex/config.toml  (per-machine)
#      or: <repo>/.codex/config.toml  (per-project)
# Reference: https://developers.openai.com/codex/config
# Codex (>= 0.21) natively supports [mcp_servers.*] with url/transport=http.

[mcp_servers.yimai]
url = "http://127.0.0.1:8787/mcp"
