# CI — moon check + test (wasm-gc)
# Runs on every push/PR to master, and manually via workflow_dispatch.
#
# Scope: the portable wasm-gc target only. `cmd/service` declares
# `supported_targets = "+native"` (async HTTP server needs MSVC on Windows),
# so it is skipped here by design; native is verified by scripts/build.ps1
# on a Windows workstation.
#
# Notes:
#   - `moon update` IS required: `moonbitlang/async` resolves through the Git
#     registry, not mooncakes.io, so a clean runner must sync the registry
#     index first. Without it `moon check` dies with
#     "Failed to resolve registry dependency `moonbitlang/async` ...
#     module was not found in the registry" (exit 255).
#   - Do NOT add `moon install` next to it: in the current CLI it means
#     "install a binary package globally" and requires a <SOURCE> argument,
#     so it always fails. (Run 43024528387 failed exactly there.)
#   - Failures are re-emitted as workflow annotations so the diagnostic is
#     readable from the Checks UI / API without expanding raw logs.
#   - The toolchain installs `latest` (versioned artifacts are not publicly
#     downloadable). Pin with MOONBIT_INSTALL_VERSION only after confirming
#     that version's tarball is reachable.
#   - Bump EXPECTED_TESTS together with the suite in the same commit.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  EXPECTED_TESTS: "175"

jobs:
  test:
    name: moon check + test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          moon version --all
          v=$(moon version 2>&1 | head -1 | tr -d '\r' | sed 's/%/%25/g')
          echo "::notice title=MoonBit toolchain::$v"

      - name: Fetch dependencies
        run: |
          set +e
          moon update 2>&1 | tee "$RUNNER_TEMP/update.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            printf '%s\n' "$(tail -10 "$RUNNER_TEMP/update.log" | nl -ba)" \
              | tr -d '\r' | cut -c1-300 | sed 's/%/%25/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error title=moon update::$l"
            done
            exit "$code"
          fi

      - name: moon check
        run: |
          set +e
          moon check 2>&1 | tee "$RUNNER_TEMP/check.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            picked=$(grep -nEi 'error|panic|assert|fail|not found|unbound|mismatch' "$RUNNER_TEMP/check.log" | head -10)
            if [ -z "$picked" ]; then picked=$(tail -10 "$RUNNER_TEMP/check.log" | nl -ba); fi
            printf '%s\n' "$picked" | tr -d '\r' | cut -c1-300 | sed 's/%/%25/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error title=moon check::$l"
            done
            exit "$code"
          fi

      - name: moon test (wasm-gc)
        run: |
          set +e
          moon test --target wasm-gc 2>&1 | tee "$RUNNER_TEMP/moon-test.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            picked=$(grep -nEi 'error|panic|assert|failed|\[FAIL\]' "$RUNNER_TEMP/moon-test.log" | head -10)
            if [ -z "$picked" ]; then picked=$(tail -10 "$RUNNER_TEMP/moon-test.log" | nl -ba); fi
            printf '%s\n' "$picked" | tr -d '\r' | cut -c1-300 | sed 's/%/%25/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error title=moon test::$l"
            done
            exit "$code"
          fi

      - name: Verify test count
        run: |
          if grep -q "passed: ${EXPECTED_TESTS}" "$RUNNER_TEMP/moon-test.log"; then
            echo "OK: ${EXPECTED_TESTS} tests passed"
          else
            summary=$(grep -E "^Total tests:" "$RUNNER_TEMP/moon-test.log" | head -1 | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=test count::expected ${EXPECTED_TESTS} passing; got: ${summary:-no summary line}"
            exit 1
          fi
