# CI — moon check + test (wasm-gc)
# Runs on every push/PR to master, and manually via workflow_dispatch.
#
# Scope: the portable wasm-gc target only. `cmd/service` declares
# `supported_targets = "+native"` (async HTTP server needs MSVC on Windows),
# so it is skipped here by design; native is verified by scripts/build.ps1
# on a Windows workstation.
#
# Notes:
#   - `moon check` resolves and downloads dependencies by itself (verified:
#     removing .mooncakes still resolves moonbitlang/async), so no explicit
#     fetch step is needed. Do NOT add `moon install` — it requires a SOURCE
#     argument and always fails without one.
#   - The toolchain installs `latest`, because versioned artifacts are not
#     publicly downloadable. If upstream drifts, pin with
#     MOONBIT_INSTALL_VERSION only after confirming that version's tarball
#     is reachable.
#   - Bump EXPECTED_TESTS together with the suite in the same commit.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  EXPECTED_TESTS: "175"

jobs:
  test:
    name: moon check + test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: moon check
        run: moon check

      - name: moon test (wasm-gc)
        run: |
          set -o pipefail
          moon test --target wasm-gc 2>&1 | tee "$RUNNER_TEMP/moon-test.log"

      - name: Verify test count
        run: |
          if grep -q "passed: ${EXPECTED_TESTS}" "$RUNNER_TEMP/moon-test.log"; then
            echo "OK: ${EXPECTED_TESTS} tests passed"
          else
            echo "FAIL: expected ${EXPECTED_TESTS} passing tests, got:"
            grep -E "^Total tests:" "$RUNNER_TEMP/moon-test.log" || echo "  (no summary line found)"
            exit 1
          fi
